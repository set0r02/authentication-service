databaseChangeLog:
  - changeSet:
      id: 1
      author: Ilya
      changes:
        - createTable:
            tableName: auth_users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: varchar(128)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(128)
                  constraints:
                    nullable: false


